[tool:pytest]
# Pytest configuration for Board Game Tracker backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --html=reports/report.html
    --self-contained-html

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    api: API endpoint tests
    slow: Slow running tests
    bgg: Tests that require BGG connection
    ai: Tests that require AI API
    smoke: Smoke tests for basic functionality

# Minimum version
minversion = 6.0

# Ignore warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300